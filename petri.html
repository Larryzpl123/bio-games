<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petri — Bacterial Territory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: a fluorescence microscope at night — quiet, precise, glowing colonies on black agar.
   IDEA: the game board is a petri dish under dark-field fluorescence; each player is a strain tagged with a real fluorescent protein.
   PICTURE: a 3D glass dish with glowing colony domes, sugar crystals, phage particles and DNA strands sitting on the agar.
   COLOUR and TYPE: near-black agar #04080a, glass cyan edge, player colours are FP emission colours; Space Grotesk numbers, Inter text.
   LAYOUT: dish fills the screen; thin glass HUD panels at the edges; mutation tree slides up as a drawer. */
:root{color-scheme:dark;--bg:#04080a;--ink:#e3f1ee;--mut:#7f9a96;--line:rgba(150,255,225,.13);--panel:rgba(7,13,15,.74);--glass:rgba(160,230,255,.08);--acc:#2dff9b;--bad:#ff4d5e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0c2124 0%,#06100f 45%,#020404 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.num{font-family:'Space Grotesk',Inter,sans-serif;font-variant-numeric:tabular-nums}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;flex-wrap:wrap}
#top>*{pointer-events:auto}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.02em;padding:8px 14px;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.brand small{font:500 12px Inter;color:var(--mut);letter-spacing:0}
#roundbox{padding:8px 14px;display:flex;gap:16px;align-items:center}
#roundbox b{font-size:18px}
.warn{color:#ff8a9a}
.sp{flex:1}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;min-height:38px;transition:background .15s,border-color .15s}
.btn:hover{border-color:rgba(150,255,225,.4);background:rgba(160,230,255,.14)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--acc);color:#02130b;border-color:transparent;font-weight:600}
.btn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#players{position:fixed;top:74px;right:12px;width:270px;max-height:calc(100vh - 250px);overflow:auto;padding:10px}
.pl{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:6px 6px;border-radius:9px}
.pl.cur{background:rgba(255,255,255,.06)}
.pl.dead{opacity:.35;text-decoration:line-through}
.pl .dot{width:12px;height:12px;border-radius:50%}
.pl .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sub{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .cells{font-size:18px;font-weight:700;text-align:right}
#log{position:fixed;left:12px;top:74px;width:290px;padding:10px 12px;font-size:12.5px;color:var(--mut);max-height:230px;overflow:hidden}
#log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}#log div:first-child{color:var(--ink)}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(980px,calc(100vw - 24px));padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.atp{display:flex;align-items:baseline;gap:6px}
.atp b{font-size:30px;font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px;color:var(--mut)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.who{font-weight:700;font-size:15px}
#offer{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(980px,calc(100vw - 24px))}
.card{width:200px;padding:12px;cursor:pointer;border-radius:14px;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card .k{font-size:11px;color:var(--mut)}.card b{display:block;font-size:15px;margin:2px 0 4px}
#tree{position:fixed;left:12px;right:12px;bottom:12px;height:min(560px,70vh);padding:14px 16px;transform:translateY(calc(100% + 30px));transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:auto;z-index:5}
#tree.open{transform:none}
.tcols{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-top:10px}
.tcol h4{margin:0 0 6px;font:600 13px 'Space Grotesk';color:var(--mut)}
.node{border:1px dashed rgba(255,255,255,.14);border-radius:11px;padding:7px 9px;margin-bottom:7px;font-size:12px;color:#8aa3a0;position:relative}
.node b{display:block;font-size:13px;color:#b9cbc8}
.node .t{position:absolute;top:6px;right:8px;font-size:10.5px;opacity:.8}
.node.can{border-style:solid;border-color:rgba(150,255,225,.38);color:var(--ink)}
.node.can b{color:var(--ink)}
.node.buy{cursor:pointer}.node.buy:hover{background:rgba(255,255,255,.06)}
.node.own{border-style:solid;color:#03110c}
.node.own b{color:#03110c}
.node .req{font-size:10.5px;opacity:.75;margin-top:2px}
.sprow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#tip{position:fixed;pointer-events:none;padding:7px 10px;font-size:12.5px;display:none;z-index:9;max-width:260px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,4,5,.6);z-index:10;padding:16px}
#modal.show{display:flex}
.mbox{width:min(1040px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px}
.mbox h1{font:700 40px/1.05 'Space Grotesk';margin:0 0 4px}
.mbox h2{font:600 15px 'Space Grotesk';margin:18px 0 8px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.seat{display:grid;grid-template-columns:14px auto 1fr;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:11px}
select{width:100%}
select,input[type=number]{font:inherit;color:var(--ink);background:#0b1517;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.spc{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12.5px;color:#a9bdba}
.spc b{color:var(--ink);font-size:14px}.spc em{color:var(--ink)}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:700 34px 'Space Grotesk';pointer-events:none;opacity:0;transition:opacity .35s;text-shadow:0 0 30px currentColor;z-index:8;white-space:nowrap}
table.rk{width:100%;border-collapse:collapse}table.rk td{padding:7px 6px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:#a9bdba}
.legend span b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
@media(max-width:900px){#log{display:none}#players{width:210px;top:120px}.brand small{display:none}}
@media(max-width:600px){#players{top:auto;bottom:150px;max-height:180px;width:180px}#bar{gap:8px}.atp b{font-size:24px}}
@media(prefers-reduced-motion:reduce){#tree{transition:none}.card{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<header id="top">
 <div class="brand panel"><i></i>PETRI<small>a bacterial territory game</small></div>
 <div id="roundbox" class="panel num"></div>
 <div class="sp"></div>
 <button class="btn panel" id="bTree">Mutation tree <span class="mut">(T)</span></button>
 <button class="btn panel" id="bRules">Rules</button>
 <button class="btn panel" id="bNew">New game</button>
</header>
<aside id="players" class="panel"></aside>
<div id="log" class="panel"></div>
<div id="offer"></div>
<div id="bar" class="panel"></div>
<section id="tree" class="panel"></section>
<div id="tip" class="panel"></div>
<div id="banner"></div>
<div id="modal"><div class="mbox panel" id="mbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
{
'use strict';
const $=s=>document.querySelector(s);
const RN=n=>Math.floor(Math.random()*n),pick=a=>a[RN(a.length)],shuf=a=>{for(let i=a.length-1;i>0;i--){const j=RN(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- data ---------------- */
const FP=[{n:'GFP',c:'#2dff9b'},{n:'mCherry',c:'#ff3d6e'},{n:'EBFP2',c:'#5b84ff'},{n:'YFP',c:'#ffe14a'},{n:'CFP',c:'#39d8ff'},{n:'mOrange',c:'#ff8a2b'},{n:'mPlum',c:'#b05cff'},{n:'mRaspberry',c:'#ff6bd6'},{n:'Citrine',c:'#b8f526'},{n:'T-Sapphire',c:'#e3e8ff'}];
const TL={glu:{n:'Glucose',c:'#ffc94a'},lac:{n:'Lactose',c:'#ffe7ad'},fe:{n:'Iron',c:'#b7c4d4'},o2:{n:'O₂ pocket',c:'#7fe7ff'},phg:{n:'Phage hotspot',c:'#ff4d5e'},dna:{n:'Free DNA',c:'#c48bff'}};
const TFREQ=[['glu',.05],['lac',.05],['fe',.035],['o2',.04],['phg',.025],['dna',.012]];
const BR=['Metabolism','Offense','Movement','Defense','Genetics'],TC=[0,4,6,8,11];
const TREE={
 lac:{n:'Lac operon',b:0,t:1,q:[],d:'Lactose tiles give +2 (only +1 if you own 3+ Glucose — catabolite repression).'},
 sid:{n:'Siderophores',b:0,t:1,q:[],d:'Iron tiles give +3.'},
 pts:{n:'PTS glucose uptake',b:0,t:1,q:[],d:'Glucose tiles give +3 instead of +2.'},
 crp:{n:'crp* (CAP without cAMP)',b:0,t:2,q:['lac'],d:'No catabolite repression: Lactose always +2.'},
 aero:{n:'Aerobic respiration',b:0,t:2,q:['lac','sid','pts'],d:'O₂ pockets give +3 instead of +1.'},
 fast:{n:'Rapid division',b:0,t:2,q:['lac','sid','pts'],d:'+2 ATP per turn.'},
 qs:{n:'Quorum sensing',b:0,t:3,q:['fast'],d:'+1 ATP per 8 cells you own.'},
 stor:{n:'Storage granules (PHB)',b:0,t:3,q:['aero','fast'],d:'ATP cap 20 → 35.'},
 tox:{n:'Bacteriocin',b:1,t:1,q:[],d:'Invading costs 1 less.'},
 prot:{n:'Matrix protease',b:1,t:2,q:['tox'],d:'Ignore enemy Biofilm and Capsule surcharges.'},
 h2o2:{n:'H₂O₂ secretion',b:1,t:2,q:['tox'],d:'Start of your turn: 1 random enemy cell touching you dies.'},
 t6:{n:'T6SS needle',b:1,t:3,q:['prot'],d:'Your first invasion each turn is free.'},
 pred:{n:'Predatory lifestyle',b:1,t:3,q:['h2o2','prot'],d:'+1 ATP back per invasion (max 3 per turn).'},
 abx:{n:'Antibiotic production',b:1,t:4,q:['t6','pred'],d:'You aim the antibiotic waves and are immune to them.'},
 mot:{n:'Flagella',b:2,t:1,q:[],d:'Grow up to 2 tiles away.'},
 twi:{n:'Twitching (type IV pili)',b:2,t:1,q:[],d:'Growth reach counts diagonals.'},
 chemo:{n:'Chemotaxis',b:2,t:2,q:['mot','twi'],d:'Growing onto special tiles is free.'},
 swarm:{n:'Swarming',b:2,t:3,q:['mot'],d:'Grow up to 3 tiles away.'},
 disp:{n:'Dispersal',b:2,t:4,q:['swarm','chemo'],d:'Once per turn: grow onto ANY empty tile for 3 ATP.'},
 bio:{n:'Biofilm',b:3,t:1,q:[],d:'Enemies pay +2 to invade you.'},
 res:{n:'Resistance plasmid',b:3,t:1,q:[],d:'Survive antibiotic waves. −1 ATP per turn (fitness cost).'},
 cap:{n:'Capsule',b:3,t:1,q:[],d:'Enemies pay +1 to invade you; immune to H₂O₂.'},
 comp:{n:'Compensatory mutation',b:3,t:2,q:['res'],d:'Resistance no longer costs ATP.'},
 pers:{n:'Persister cells',b:3,t:2,q:['bio','cap'],d:'Each of your cells hit by a wave survives 50% of the time.'},
 cr:{n:'CRISPR-Cas',b:3,t:2,q:['bio','res','cap'],d:'Never lose cells on Phage hotspots.'},
 spore:{n:'Endospores',b:3,t:3,q:['pers','bio'],d:'Once per game: when wiped out, respawn as a 2×2 colony.'},
 mbio:{n:'Mature biofilm',b:3,t:4,q:['spore','pers'],d:'Your cells with 3+ friendly neighbours cannot be invaded.'},
 compt:{n:'Natural competence',b:4,t:1,q:[],d:'+1 mutation offer; Free DNA lets you choose (3 options).'},
 mutr:{n:'Mutator (mutS⁻)',b:4,t:1,q:[],d:'All mutations cost 1 less, but you lose 1 random cell each round.'},
 conj:{n:'Conjugation',b:4,t:2,q:['compt','mutr'],d:'Once per turn, 3 ATP: copy a trait from an enemy you touch.'},
 integ:{n:'Integron',b:4,t:3,q:['conj'],d:'Gain a free random trait at every antibiotic wave.'}};
const SPECIES=[
 {id:'eco',n:'Escherichia coli',a:[['Lab workhorse','Starts with Lac operon.'],['F plasmid','Can conjugate from turn 1, for 2 ATP.']],start:['lac'],f:{conjFree:1}},
 {id:'bsu',n:'Bacillus subtilis',a:[['Sporulation','Starts with Endospores.'],['Competent','Starts with Natural competence.']],start:['spore','compt'],f:{}},
 {id:'pae',n:'Pseudomonas aeruginosa',a:[['Biofilm former','Starts with Biofilm.'],['Pyoverdine','Starts with Siderophores; Iron gives +1 extra.']],start:['bio','sid'],f:{feBonus:1}},
 {id:'vch',n:'Vibrio cholerae',a:[['Polar flagellum','Starts with Flagella.'],['T6SS','First invasion each turn costs 1 less.']],start:['mot'],f:{t6lite:1}},
 {id:'sco',n:'Streptomyces coelicolor',a:[['Antibiotic factory','Starts with Antibiotic production (aim waves, immune).'],['Slow hyphae','Base income −1.']],start:['abx'],f:{base:-1}},
 {id:'sau',n:'Staphylococcus aureus',a:[['MRSA','Starts with Resistance + Compensatory mutation.'],['α-toxin','Starts with Bacteriocin.']],start:['res','comp','tox'],f:{base:-1}},
 {id:'mtb',n:'Mycobacterium tuberculosis',a:[['Waxy mycolic wall','Enemies pay +2 to invade you; waves kill only ~50% of your cells; immune to H₂O₂.'],['Slow growth','Base income −1.']],start:[],f:{wax:1,base:-1}},
 {id:'mxa',n:'Myxococcus xanthus',a:[['Social predator','Starts with Predatory lifestyle.'],['Gliding','Starts with Twitching.']],start:['pred','twi'],f:{base:-1}},
 {id:'ana',n:'Anabaena (cyanobacterium)',a:[['Photosynthesis','+1 ATP per 5 cells you own.'],['Heterocysts (N₂ fixation)','+1 base income, but Glucose gives only +1.']],start:[],f:{photo:1,base:1,glu1:1}},
 {id:'lbc',n:'Lactobacillus',a:[['Dairy specialist','Starts with Lac operon.'],['Lactic acid','Starts with H₂O₂-style killing: 1 enemy neighbour dies each turn.']],start:['lac','h2o2'],f:{base:-1}}];
const SPI=Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const AUTO={2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,10:28};

/* ---------------- config & state ---------------- */
let cfg={n:4,shape:'Circle',size:'Auto',custom:22,rounds:20,mode:'Random offers',diff:'Normal',seats:[]};
function ensureSeats(){while(cfg.seats.length<10)cfg.seats.push({human:cfg.seats.length===0,sp:'random'})}ensureSeats();
let S=null;
const log=s=>{S.log.unshift(s);S.log.length=Math.min(S.log.length,40)};
const NN=()=>S.N;
const nb4=i=>{const n=S.N,r=i/n|0,c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o.filter(j=>S.land[j])};
const has=(p,k)=>S.players[p].tr.has(k),fl=(p,f)=>S.players[p].sp.f[f]||0;
const count=p=>{let k=0;for(const o of S.grid)if(o===p)k++;return k};
const gluOwned=p=>{let k=0;S.grid.forEach((o,i)=>{if(o===p&&S.tile[i]==='glu')k++});return k};
function tileVal(p,k,g){switch(k){case'glu':return fl(p,'glu1')?1:has(p,'pts')?3:2;case'lac':return has(p,'lac')?(g>=3&&!has(p,'crp')?1:2):0;case'fe':return has(p,'sid')?3+fl(p,'feBonus'):0;case'o2':return has(p,'aero')?3:1;case'phg':return 2}return 0}
function incomeParts(p){const cells=count(p),g=gluOwned(p);let tiles=0;S.grid.forEach((o,i)=>{if(o===p&&S.tile[i])tiles+=tileVal(p,S.tile[i],g)});
 const a=[['base',3+fl(p,'base')],['colony',cells/10|0],['tiles',tiles]];if(has(p,'fast'))a.push(['rapid div.',2]);if(has(p,'qs'))a.push(['quorum',cells/8|0]);if(fl(p,'photo'))a.push(['photosynth.',cells/5|0]);if(has(p,'res')&&!has(p,'comp'))a.push(['resist. cost',-1]);return a}
const income=p=>Math.max(1,incomeParts(p).reduce((s,x)=>s+x[1],0)),capOf=p=>has(p,'stor')?35:20;
function reachSet(p){const n=S.N,d=has(p,'swarm')?3:has(p,'mot')?2:1,cheb=has(p,'twi'),out=new Set();
 S.grid.forEach((o,i)=>{if(o!==p)return;const r=i/n|0,c=i%n;for(let a=-d;a<=d;a++)for(let b=-d;b<=d;b++){if((cheb?Math.max(Math.abs(a),Math.abs(b)):Math.abs(a)+Math.abs(b))>d)continue;const rr=r+a,cc=c+b;if(rr<0||cc<0||rr>=n||cc>=n)continue;const j=rr*n+cc;if(S.land[j]&&S.grid[j]===-1)out.add(j)}});return out}
const growCost=(p,i)=>has(p,'chemo')&&S.tile[i]?0:1;
const ownNb=(p,i)=>nb4(i).filter(j=>S.grid[j]===p).length;
function invCost(p,i){const o=S.grid[i];if(o<0||o===p||!S.players[o].alive)return null;if(!nb4(i).some(j=>S.grid[j]===p))return null;if(has(o,'mbio')&&ownNb(o,i)>=3)return null;
 const P=S.players[p];if(has(p,'t6')&&P.inv===0)return 0;const pr=has(p,'prot');
 return Math.max(1,3-(has(p,'tox')?1:0)-(fl(p,'t6lite')&&P.inv===0?1:0)+(has(o,'bio')&&!pr?2:0)+(has(o,'cap')&&!pr?1:0)+(fl(o,'wax')?2:0))}
const canDisp=p=>has(p,'disp')&&!S.players[p].disp&&S.players[p].atp>=3;
const traitCost=(p,k)=>Math.max(1,TC[TREE[k].t]-(has(p,'mutr')?1:0));
const mutCost=p=>Math.max(1,4+(S.players[p].bought/3|0)-(has(p,'mutr')?1:0));
const nOffers=p=>3+(has(p,'compt')?1:0);
const unlockable=p=>Object.keys(TREE).filter(k=>!has(p,k)&&(TREE[k].q.length===0||TREE[k].q.some(x=>has(p,x))));
function touching(p){const s=new Set();S.grid.forEach((o,i)=>{if(o===p)for(const j of nb4(i)){const q=S.grid[j];if(q>=0&&q!==p)s.add(q)}});return[...s]}
const conjCost=p=>fl(p,'conjFree')?2:3;
function conjList(p){const s=new Set();for(const q of touching(p))for(const k of S.players[q].tr)if(!has(p,k))s.add(k);return[...s]}
const canConj=p=>(has(p,'conj')||fl(p,'conjFree'))&&!S.players[p].conjUsed&&S.players[p].atp>=conjCost(p)&&conjList(p).length>0;
const immune=o=>has(o,'abx')||has(o,'res'),halfWave=o=>has(o,'pers')||fl(o,'wax');
const inBand=i=>{const v=S.band.ax==='r'?(i/S.N|0):i%S.N;return v>=S.band.st&&v<S.band.st+S.band.w};
const warnOn=()=>S.round>=S.bandRound-1;
const humansAlive=()=>S.players.some(p=>p.human&&p.alive);

/* ---------------- setup ---------------- */
function newGame(){const n=cfg.n;let N=cfg.size==='Custom'?Math.max(8,Math.min(40,cfg.custom|0||AUTO[n])):AUTO[n];
 const c0=(N-1)/2,land=Array(N*N).fill(true);if(cfg.shape==='Circle')for(let i=0;i<N*N;i++){const r=i/N|0,c=i%N;land[i]=(r-c0)**2+(c-c0)**2<=(N/2)**2}
 const grid=Array(N*N).fill(-1),tile=Array(N*N).fill(null),players=[];
 const free=shuf(SPECIES.map(s=>s.id).filter(id=>!cfg.seats.slice(0,n).some(s=>s.sp===id)));
 const ok=(r,c)=>r>=0&&c>=0&&r<N-1&&c<N-1&&[0,1,N,N+1].every(o=>land[r*N+c+o]&&grid[r*N+c+o]<0);
 const off=Math.random()*6.283;let hn=0;
 for(let i=0;i<n;i++){const st=cfg.seats[i],a=off+6.283*i/n,tr=c0+.36*N*Math.sin(a),tc=c0+.36*N*Math.cos(a);let best=null,bd=1e9;
  for(let r=0;r<N-1;r++)for(let c=0;c<N-1;c++)if(ok(r,c)){const d=(r-tr)**2+(c-tc)**2;if(d<bd){bd=d;best=[r,c]}}
